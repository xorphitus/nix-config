# Delay and hysteresis keep short temperature spikes from revving the fan
[[functions]]
uid = "smooth"
name = "Smooth"
f_type = "Standard"
duty_minimum = 3
duty_maximum = 100
response_delay = 5
deviance = 3.0
only_downward = false

